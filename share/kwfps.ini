; kwfps settings. Save the file and restart the game to apply changes.

[pacing]
; 1 = smooth high frame rate with the game running at normal speed. 0 = off.
Enabled = 1
; auto = follow your monitor: 3 under the refresh rate on 120 Hz+ screens,
; the refresh rate itself below that. Or set a number, e.g. 141 for 144 Hz.
ClientRate = auto
; Frame rate limit. auto = same as ClientRate; 0 = no limit.
FrameCap = auto

[camera]
; How far you can zoom out. The game's own limit is 300; 0 leaves it alone.
MaxHeight = 700

[keys]
; Turbo (fast-forward) on/off key for skirmish against the AI. 122 = F11, 0 = none.
; Don't use it in multiplayer.
TurboKey = 122

[cheats]
; Income multiplier (skirmish). 0 leaves the game alone. Everyone in a
; multiplayer game, and anyone watching a replay of it, needs the same value.
MoneyMult = 0

[probe]
; Frames slower than this (ms) are noted in kwfps.log.
SpikeMs = 25
